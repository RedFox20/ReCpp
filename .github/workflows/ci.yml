# The first step of the move from CircleCI to GitHub Actions. CircleCI still runs
# the whole matrix, and this workflow proves one job before it takes the rest.
name: CI

# a branch push and its pull request both match, so push stays on master alone.
# Otherwise every push to an open pull request starts the same job twice
on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-cpp20-asan-gcc13:
    name: ubuntu-cpp20-asan-gcc13
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ubuntu-build
        with:
          job_name: ubuntu-cpp20-asan-gcc13
          compiler: gcc
          cc_version: gcc-13
          cpp_version: "20"
          sanitizer: asan
          coverage: "true"
