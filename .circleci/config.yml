version: 2.1
orbs:
  win: circleci/windows@5.0 # VS2022

parameters:
  mama_ref:
    type: string
    # TEMPORARY: every job installs mama from this Mama branch instead of the released one.
    # Empty the string to go back to the mama on PyPI. Nothing else changes.
    # Track the branch, not a commit. A pin hides a broken tip, and this CI is where a
    # mama defect must surface.
    default: "feature/support-module-cppm"

commands:
  install_mama:
    description: >
      Replaces the released mama with a build of pipeline.parameters.mama_ref.
      The released install stays, so pip resolves the dependencies from PyPI and this
      overwrites the mama package alone. It does nothing when the parameter is empty.
    parameters:
      pip:
        type: string
        default: "pipenv run pip"
        description: "the pip that writes to the same environment as the mama on PATH"
    steps:
      - when:
          condition: << pipeline.parameters.mama_ref >>
          steps:
            - run:
                name: Install mama << pipeline.parameters.mama_ref >>
                # one line per command: PowerShell runs this block on the windows jobs, and it
                # reads a trailing backslash as an argument instead of a line continuation
                command: |
                  << parameters.pip >> install --no-deps --force-reinstall "git+https://github.com/RedFox20/Mama.git@<< pipeline.parameters.mama_ref >>"
                  << parameters.pip >> show mama

jobs:
  ubuntu-build:
    parameters:
      compiler:
        type: enum
        enum: ["clang", "gcc"]
        description: "Compiler to use"
      cc_version:
        type: string
        default: "gcc-13"
        description: "Compiler version (gcc-13 or clang-18)"
      cpp_version:
        type: enum
        enum: ["20", "23", "26"]
        default: "20"
        description: "C++ standard version (20, 23, or 26)"
      sanitizer:
        type: enum
        enum: ["asan", "clang-tidy", "tsan"]
        default: "asan"
        description: "Sanitizer/analysis tool to use"
      coverage:
        type: boolean
        default: false
        description: "Whether to generate code coverage report (only supported for gcc with ASAN)"
      no_ninja:
        type: string
        default: "1"
        description: "1 disables Ninja to save CI memory. A modules build passes an empty string"
      build_with_modules:
        type: string
        default: ""
        description: "ON demands modules, so a toolchain that cannot build them fails the configure"
      llvm_apt:
        type: boolean
        default: false
        description: "Register apt.llvm.org, for a clang release the CI image does not carry"
      check_includes:
        type: boolean
        default: false
        description: "Run the header and import-order gates. One job is enough, so it is opt-in"
    description: "Ubuntu << parameters.cc_version >> C++<< parameters.cpp_version >> build with << parameters.sanitizer >> sanitizer"
    #resource_class: large # 4 CPU-s, 8GB RAM (more needed when using NINJA)
    resource_class: medium+ # medium+: 3 CPU-s, 6GB RAM, large: 4 CPU-s, 8GB RAM
    docker:
      - image: cimg/python:3.14
    environment:
      COMPILER: << parameters.compiler >>
      SANITIZE: << parameters.sanitizer >>
      CPP_STANDARD: CXX<< parameters.cpp_version >>
      COV_PARAM: << parameters.coverage >>
      # Ninja detects 36 cores instead of 3 and the machines OOM, so it is off by default.
      # A modules build needs it: CMake scans module dependencies only under Ninja.
      NO_NINJA: << parameters.no_ninja >>
      BUILD_WITH_MODULES: << parameters.build_with_modules >>
    steps:
      - checkout
      - run: sudo apt-get update
      - run: sudo apt -y --allow-unauthenticated install libdw-dev libunwind-dev gdb gcovr ninja-build
      - when:
          condition: << parameters.llvm_apt >>
          steps:
            - run:
                name: Register apt.llvm.org for << parameters.cc_version >>
                command: |
                  LLVM_VER=$(echo "<< parameters.cc_version >>" | cut -d- -f2)
                  wget -qO llvm.sh https://apt.llvm.org/llvm.sh
                  chmod +x llvm.sh
                  sudo ./llvm.sh $LLVM_VER
                  # CMake scans module dependencies with clang-scan-deps, which ships in
                  # clang-tools. Without it a modules build configures and then fails.
                  sudo apt-get install -y clang-tools-$LLVM_VER
      - run: pipenv install mama
      - install_mama
      - run: pipenv run mama install-<< parameters.cc_version >>
      - when:
          condition: << parameters.check_includes >>
          steps:
            - run:
                name: Header and import-order gates
                command: |
                  # every header must compile alone, so a consumer may include any one first
                  export CXX=$([[ $COMPILER == "gcc" ]] && echo g++ || echo clang++)
                  export CXXSTD=c++<< parameters.cpp_version >>
                  python3 tools/check_includes.py self-contained --check
                  # an #include after an import gives GCC a thousand redefinitions, and clang
                  # accepts the same file, so only this gate stops it reaching a GCC build
                  python3 tools/check_includes.py import-order --check
      - run: make configure-cmake
      - run:
          name: Build << parameters.cc_version >> C++<< parameters.cpp_version >> << parameters.sanitizer >>
          command: |
            export $CPP_STANDARD=1
            COV_FLAGS=$([[ $COV_PARAM == "true" && $COMPILER == "gcc" && $SANITIZE == "asan" ]] && echo "coverage=src" || echo "")
            # disable clang + clang-tidy sanitizer combination
            SAN_FLAGS=$([[ $SANITIZE == "clang-tidy" && $COMPILER == "clang" ]] && echo "" || echo "$SANITIZE")
            # mama passes jobs= to make and msbuild but never to ninja, and ninja then sizes
            # itself from the host core count, not the container limit, and the box OOMs.
            # taskset pins the affinity, which is what ninja reads.
            NINJA_CAP=$([[ -z "$NO_NINJA" ]] && echo "taskset -c 0-2" || echo "")
            $NINJA_CAP pipenv run mama $COMPILER verbose $SAN_FLAGS $COV_FLAGS build with_tests jobs=3
      - run:
          name: Test << parameters.cc_version >> C++<< parameters.cpp_version >> << parameters.sanitizer >>
          command: |
            export $CPP_STANDARD=1
            COV_FLAGS=$([[ $COV_PARAM == "true" && $COMPILER == "gcc" && $SANITIZE == "asan" ]] && echo "coverage-report=src" || echo "")
            # setarch -R turns off address space randomization. Without it TSAN aborts on
            # these runners with "FATAL: ThreadSanitizer: unexpected memory mapping".
            setarch $(uname -m) -R pipenv run mama $COMPILER verbose $COV_FLAGS test="nogdb -vv" jobs=3
      - when:
          condition:
            and:
              - equal: [ "clang-tidy", << parameters.sanitizer >> ]
              - equal: [ "clang", << parameters.compiler >> ]
          steps:
            - run:
                name: Clang Tidy Analysis # run clang-tidy separately for Clang++ because it's super slow during build
                command: ./run_clang_tidy -j 5
  win64-cpp20-msvc2022:
    description: Windows MSVC C++20 VS2022 x64 Build
    executor:
      name: win/default
      size: medium # can be medium(4 CPU), large, xlarge, 2xlarge
    steps:
      - checkout
      - run: pip3 install mama
      - install_mama:
          pip: "pip3"
      - run: choco install cmake -y
      - run:
          name: Build
          command: |
              $env:Path+=";$Env:ProgramFiles\CMake\bin";
              $env:BUILD_WITH_MEM_SAFETY="ON";
              $env:CXX20="1";
              mama windows verbose build with_tests jobs=4
      - run:
          name: Tests
          command: |
              $env:Path+=";$Env:ProgramFiles\CMake\bin";
              mama windows verbose test="-vv" jobs=4
  mipsel-cpp20-gcc12:
    description: MIPSEL C++20 GCC Build (NO TESTS)
    resource_class: medium+ # medium+: 3 CPU-s, 6GB RAM, large: 4 CPU-s, 8GB RAM
    docker:
      - image: cimg/python:3.14
    environment:
      # Ninja detects 36 cores instead of 3 and the machines OOM, so it is off by default.
      # A modules build needs it: CMake scans module dependencies only under Ninja.
      NO_NINJA: 1
    steps:
      - checkout
      - run: sudo apt-get update
      - run: sudo apt -y --allow-unauthenticated install gcc-mipsel-linux-gnu g++-mipsel-linux-gnu
      - run: pipenv install mama
      - install_mama
      - run: make configure-cmake
      - run: CXX20=1 pipenv run mama mips verbose build jobs=3
  consumer-integration:
    parameters:
      compiler:
        type: enum
        enum: ["clang", "gcc"]
        default: "gcc"
        description: "Compiler the consumer builds ReCpp with"
      cc_version:
        type: string
        default: "gcc-14"
        description: "Compiler version. It must clear the modules minimum, gcc-14 or clang-21"
      llvm_apt:
        type: boolean
        default: false
        description: "Register apt.llvm.org, for a clang release the CI image does not carry"
    description: Build ReCpp with << parameters.cc_version >> as another project builds it, as a dependency and not the root
    resource_class: medium+ # medium+: 3 CPU-s, 6GB RAM, large: 4 CPU-s, 8GB RAM
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      - run: sudo apt-get update
      - run: sudo apt -y --allow-unauthenticated install libdw-dev libunwind-dev ninja-build
      - run: pipenv install mama
      - install_mama
      - when:
          condition: << parameters.llvm_apt >>
          steps:
            - run:
                name: Register apt.llvm.org for << parameters.cc_version >>
                command: |
                  LLVM_VER=$(echo "<< parameters.cc_version >>" | cut -d- -f2)
                  wget -qO llvm.sh https://apt.llvm.org/llvm.sh
                  chmod +x llvm.sh
                  sudo ./llvm.sh $LLVM_VER
                  # CMake scans module dependencies with clang-scan-deps, which ships in
                  # clang-tools. Without it a modules build configures and then fails.
                  sudo apt-get install -y clang-tools-$LLVM_VER
                  # CMake also accepts the unversioned name, so alias it the way mama aliases clang
                  sudo update-alternatives --install /usr/bin/clang-scan-deps clang-scan-deps \
                                           /usr/bin/clang-scan-deps-$LLVM_VER 100
                  # fail here, where the cause is obvious, instead of at the modules check later
                  clang-scan-deps --version
      # Ninja plus a compiler over the modules minimum turns modules on by itself, so this
      # job builds ReCpp with modules the way a downstream project builds it.
      - run: pipenv run mama install-<< parameters.cc_version >>
      - run: make configure-cmake
      - run:
          name: Build and run the consumer with << parameters.cc_version >>
          command: |
            # the Pipfile lives at the repo root, and the consumer builds one level down
            export PIPENV_PIPFILE=$(pwd)/Pipfile
            cd tests/consumer
            # ninja reads the affinity mask, and it ignores the jobs= mama passes to make
            CXX20=1 taskset -c 0-2 pipenv run mama << parameters.compiler >> verbose build test jobs=3 2>&1 | tee build.log
            # AUTO turns modules off and keeps going, so without this the job would still pass
            # if ReCpp stopped enabling modules when another project builds it
            if ! grep -q "C++20 Modules enabled" build.log; then
              echo "FAIL: ReCpp built no modules as a dependency"
              grep -i "MODULES" build.log
              # a missing binary blames this job, a set binary with an empty cache entry blames
              # the build tool, which configures a dependency differently from a root target
              echo "--- clang-scan-deps on this box ---"
              ls -la /usr/bin/clang-scan-deps* /usr/lib/llvm-*/bin/clang-scan-deps 2>&1 | head
              echo "--- what cmake resolved for the ReCpp dependency ---"
              find .. -name CMakeCache.txt -path "*ReCpp*" \
                   -exec grep -H "CMAKE_CXX_COMPILER:\|CLANG_SCAN_DEPS" {} \; 2>/dev/null | head
              exit 1
            fi
      - run:
          name: Import the exported modules with << parameters.cc_version >>
          command: |
            # this job clears the modules minimum, so the consumer must take the module path.
            # --compare-paths builds the same source through the headers and compares the report
            export PIPENV_PIPFILE=$(pwd)/Pipfile
            cd tests/module_consumer
            CXX20=1 taskset -c 0-2 pipenv run python3 run_test.py \
                --compiler << parameters.compiler >> --expect modules --compare-paths --jobs 3
  consumer-integration-msvc:
    description: Build ReCpp with MSVC as another project builds it, as a dependency and not the root
    executor:
      name: win/default
      size: medium # can be medium(4 CPU), large, xlarge, 2xlarge
    steps:
      - checkout
      - run: pip3 install mama
      - install_mama:
          pip: "pip3"
      - run: choco install cmake -y
      - run:
          name: Build and run the consumer
          command: |
              $env:Path+=";$Env:ProgramFiles\CMake\bin";
              $env:CXX20="1";
              cd tests/consumer
              # a bare cmake message() writes to stderr, so the log needs 2>&1 to catch the
              # modules line, and Continue keeps those lines from aborting the step
              $ErrorActionPreference = 'Continue'
              # mama picks a Visual Studio generator, and CMake scans modules on that one too
              mama windows verbose build test jobs=4 2>&1 | Tee-Object -FilePath build.log
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              # AUTO turns modules off and keeps going, so without this the job would still pass
              # if ReCpp stopped enabling modules when another project builds it
              if (-not (Select-String -Path build.log -Pattern 'C\+\+20 Modules enabled' -Quiet)) {
                  Write-Host "FAIL: ReCpp built no modules as a dependency"
                  Select-String -Path build.log -Pattern 'MODULES'
                  exit 1
              }
      - run:
          name: Import the exported modules
          command: |
              $env:Path+=";$Env:ProgramFiles\CMake\bin";
              $env:CXX20="1";
              cd tests/module_consumer
              # cmake and mama write to stderr, and Continue keeps those lines from aborting
              # the step, the same reason the consumer build above sets it
              $ErrorActionPreference = 'Continue'
              python run_test.py --compiler windows --expect modules --compare-paths --jobs 4 2>&1 | Tee-Object -FilePath module_consumer.log
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  android-build:
    parameters:
      docker_image:
        type: enum
        enum: ["cimg/android:2023.08.1-ndk", "cimg/android:2024.11.1-ndk", "cimg/android:2025.12.1-ndk", "cimg/android:2026.03.1-ndk"]
        description: "Android NDK docker image"
      toolchain:
        type: string
        description: "Informational toolchain description, e.g. ndk-r25b-clang++14"
      ndk_version:
        type: string
        default: ""
        description: "Override NDK version, e.g. 29.0.14206865 to use NDK r29 instead of the default LTS"
      no_ninja:
        type: string
        default: "1"
        description: "1 disables Ninja to save CI memory. Pass an empty string to test the Ninja path"
    description: "Android << parameters.toolchain >> C++20 build with clang-tidy sanitizer"
    resource_class: medium+ # medium+: 3 CPU-s, 6GB RAM, large: 4 CPU-s, 8GB RAM
    docker:
      - image: << parameters.docker_image >>
    environment:
      # Ninja detects 36 cores instead of 3 and the machines OOM, so it is off by default.
      # A modules build needs it: CMake scans module dependencies only under Ninja.
      NO_NINJA: << parameters.no_ninja >>
    steps:
      - checkout
      - when:
          condition: << parameters.ndk_version >>
          steps:
            - run:
                name: Override NDK to << parameters.ndk_version >>
                command: |
                  NDK_PATH="/home/circleci/android-sdk/ndk/<< parameters.ndk_version >>"
                  echo "export ANDROID_NDK_HOME=$NDK_PATH" >> "$BASH_ENV"
                  echo "export ANDROID_NDK_ROOT=$NDK_PATH" >> "$BASH_ENV"
      - run: sudo apt-get update -q && sudo apt-get install -y clang-tidy qemu-user
      - run: make configure-cmake
      - run: sudo rm /usr/lib/python3.12/EXTERNALLY-MANAGED || true
      - run: make configure-pip3
      - run: pip3 install mama
      - install_mama:
          pip: "pip3"
      - run:
          name: Build Android NDK << parameters.toolchain >>
          command: |
              echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
              # ninja reads the affinity mask, and it ignores the jobs= mama passes to make
              NINJA_CAP=$([[ -z "$NO_NINJA" ]] && echo "taskset -c 0-2" || echo "")
              $NINJA_CAP env CXX20=1 mama android verbose build with_tests jobs=3
      - run:
          name: Run Tests Android NDK << parameters.toolchain >> (QEMU aarch64)
          command: ./run_android_tests -vv
      - run:
          name: Clang Tidy Analysis # run clang-tidy separately because it's super slow during build
          command: ./run_clang_tidy --android -j 5

workflows:
  build_all:
    jobs:
      # Clang builds on Ubuntu
      - ubuntu-build:
          matrix:
            parameters:
              cpp_version: ["20", "23"]
              sanitizer: ["asan", "clang-tidy", "tsan"]
          name: ubuntu-cpp<< matrix.cpp_version >>-<< matrix.sanitizer >>-clang18
          compiler: clang
          cc_version: clang-18
          coverage: true
      # TODO: clang++20 C++26 tests crash due to codecvt deprecation
      # TODO: Clang C++26 build
      # GCC builds on Ubuntu
      - ubuntu-build:
          matrix:
            parameters:
              cpp_version: ["20", "23"]
              sanitizer: ["asan", "clang-tidy", "tsan"]
          name: ubuntu-cpp<< matrix.cpp_version >>-<< matrix.sanitizer >>-gcc13
          compiler: gcc
          cc_version: gcc-13
          coverage: true
      # Run Newer GCC builds on Ubuntu with C++26 and latest sanitizers
      # TODO: CI does not support gcc-15 yet
      - ubuntu-build:
          matrix:
            parameters:
              cpp_version: ["26"]
              sanitizer: [ "asan", "clang-tidy", "tsan"]
          name: ubuntu-cpp<< matrix.cpp_version >>-<< matrix.sanitizer >>-gcc14
          compiler: gcc
          cc_version: gcc-14
          coverage: false # this can cause OOM in CI with GCC-14, disabling for now
      # Clang 20 on Ubuntu. clang-21 is not in the CI image apt sources, so
      # `mama install-clang-21` cannot run. Modules stay off here: CMakeLists.txt
      # needs Clang 21, sees 20, and falls back to headers with a message.
      - ubuntu-build:
          matrix:
            parameters:
              cpp_version: ["20", "23"]
              sanitizer: ["asan"]
          name: ubuntu-cpp<< matrix.cpp_version >>-<< matrix.sanitizer >>-clang20
          compiler: clang
          cc_version: clang-20
          coverage: false
      # C++20 modules. These need Ninja, so they pass an empty no_ninja.
      # They also pass BUILD_WITH_MODULES=ON, not AUTO. AUTO turns modules off and
      # keeps going, so a job named modules would pass while it tested only headers.
      - ubuntu-build:
          name: ubuntu-cpp20-modules-gcc14
          compiler: gcc
          cc_version: gcc-14
          cpp_version: "20"
          sanitizer: "asan"
          coverage: false
          no_ninja: ""
          build_with_modules: "ON"
          # one job proves header self-containment, so it runs only here
          check_includes: true
      # Clang 21 is not in the CI image apt sources, so this job registers apt.llvm.org
      # and adds clang-tools-21, which carries the clang-scan-deps that CMake needs.
      - ubuntu-build:
          name: ubuntu-cpp20-modules-clang21
          compiler: clang
          cc_version: clang-21
          cpp_version: "20"
          sanitizer: "asan"
          coverage: false
          no_ninja: ""
          build_with_modules: "ON"
          llvm_apt: true
      # Integration: ReCpp as somebody else's dependency, on all three compiler families
      - consumer-integration:
          name: consumer-integration
          compiler: gcc
          cc_version: gcc-14
      - consumer-integration:
          name: consumer-clang21
          compiler: clang
          cc_version: clang-21
          llvm_apt: true
      - consumer-integration-msvc:
          name: consumer-msvc2022
      # Other platform builds
      - win64-cpp20-msvc2022
      - mipsel-cpp20-gcc12
      # Android NDK builds
      - android-build:
          name: android-cpp20-r25b-clang-tidy-clang14
          docker_image: "cimg/android:2023.08.1-ndk"
          toolchain: "ndk-r25b-clang++14"
      - android-build:
          name: android-cpp20-r27-clang-tidy-clang18
          docker_image: "cimg/android:2024.11.1-ndk"
          toolchain: "ndk-r27-clang++18"
          ndk_version: "27.2.12479018"
      - android-build:
          name: android-cpp20-r28b-clang-tidy-clang19
          docker_image: "cimg/android:2025.12.1-ndk"
          toolchain: "ndk-r28b-clang++19"
          ndk_version: "28.2.13676358"
      - android-build:
          name: android-cpp20-r29-clang-tidy-clang20
          docker_image: "cimg/android:2026.03.1-ndk"
          toolchain: "ndk-r29-clang++20"
          ndk_version: "29.0.14206865"
      # Every other Android job forces NO_NINJA=1, so CI never ran the NDK under Ninja.
      # That is the generator a consumer picks, and the only one that scans modules.
      - android-build:
          name: android-cpp20-r29-ninja
          docker_image: "cimg/android:2026.03.1-ndk"
          # NDK r29 ships Clang 21, so this job clears the version check and the
          # clang-scan-deps guard is what decides whether it builds modules
          toolchain: "ndk-r29-ninja"
          ndk_version: "29.0.14206865"
          no_ninja: ""
